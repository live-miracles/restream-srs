version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # codeql-action/init and /analyze must stay on the same version; separate
      # PRs for each leave the CodeQL workflow failing with a version mismatch.
      codeql:
        patterns:
          - github/codeql-action/*
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
